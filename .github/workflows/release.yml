name: Release Build

# Compile the executables on every push (any branch + tags) so a feature
# branch push produces downloadable Windows .exe / Linux AppImage artifacts
# without having to merge to main first. The publish-release job is guarded
# below so feature-branch pushes only BUILD artifacts and never touch the
# releases page -- only main/master/tag pushes publish. workflow_dispatch
# allows a manual run.
#
# What gets published:
#   * a version tag (vX.Y.Z)  -> the stable release, marked latest;
#   * a main/master push      -> its OWN pre-release, vX.Y.Z-pre.<run number>,
#     where X.Y.Z is the version in api/pyproject.toml. Builds no longer
#     overwrite each other: every development build keeps its own tag, assets
#     and permalink, and the newest ten are retained (see the prune step).
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Match the Node 24 (Krypton) Active LTS runtime that
          # scripts/prepare_assets.py now bundles into the AppImage/exe, and
          # that package.json's undici 7 / @types/node 24 are pinned against.
          node-version: 24
          cache: 'npm'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Node.js dependencies and build frontend
        run: |
          npm ci --legacy-peer-deps
          npm run build

      - name: Install Poetry
        run: |
          pip install poetry==2.4.1

      - name: Install Python dependencies
        working-directory: api
        run: |
          poetry config virtualenvs.create false
          # Regenerate the lock file if pyproject.toml was edited without
          # running `poetry lock` locally. Keeps the build green when only the
          # content hash is out of sync. (`--no-update` was removed in Poetry 2.)
          poetry lock
          poetry install --only main
          pip install pyinstaller

      - name: Prepare build assets
        run: |
          python scripts/prepare_assets.py windows

      - name: Build with PyInstaller
        run: |
          pyinstaller hackdeepwiki.spec

      - name: Rename and upload Windows binary
        uses: actions/upload-artifact@v4
        with:
          name: hackdeepwiki-windows
          path: dist/hackdeepwiki.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Match the Node 24 (Krypton) Active LTS runtime that
          # scripts/prepare_assets.py now bundles into the AppImage/exe, and
          # that package.json's undici 7 / @types/node 24 are pinned against.
          node-version: 24
          cache: 'npm'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Node.js dependencies and build frontend
        run: |
          npm ci --legacy-peer-deps
          npm run build

      - name: Install Poetry
        run: |
          pip install poetry==2.4.1

      - name: Install Python dependencies
        working-directory: api
        run: |
          poetry config virtualenvs.create false
          # Regenerate the lock file if pyproject.toml was edited without
          # running `poetry lock` locally. Keeps the build green when only the
          # content hash is out of sync. (`--no-update` was removed in Poetry 2.)
          poetry lock
          poetry install --only main
          pip install pyinstaller

      - name: Prepare build assets
        run: |
          python scripts/prepare_assets.py linux

      - name: Build with PyInstaller
        run: |
          pyinstaller hackdeepwiki.spec

      - name: Package AppImage
        run: |
          # 1. Create AppDir structure
          mkdir -p AppDir/usr/bin

          # 2. Copy launcher (onedir build: a folder containing the exe +
          # _internal/, not a single file) and assets
          cp -r dist/hackdeepwiki/. AppDir/usr/bin/
          cp public/hackdeepwiki.png AppDir/hackdeepwiki.png
          
          # 3. Create AppRun script
          cat << 'EOF' > AppDir/AppRun
          #!/bin/sh
          SELF=$(readlink -f "$0")
          HERE=$(dirname "$SELF")
          exec "$HERE/usr/bin/hackdeepwiki" "$@"
          EOF
          chmod +x AppDir/AppRun
          
          # 4. Create desktop entry
          cat << 'EOF' > AppDir/hackdeepwiki.desktop
          [Desktop Entry]
          Name=HackDeepWiki
          Exec=hackdeepwiki
          Icon=hackdeepwiki
          Type=Application
          Categories=Development;
          Comment=AI-powered wiki generation and code analysis
          Terminal=true
          EOF
          
          # 5. Download and run appimagetool
          curl -LO https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          
          export APPIMAGE_EXTRACT_AND_RUN=1
          ./appimagetool-x86_64.AppImage --no-appstream AppDir HackDeepWiki-x86_64.AppImage

      - name: Upload Linux AppImage
        uses: actions/upload-artifact@v4
        with:
          name: hackdeepwiki-linux
          path: HackDeepWiki-x86_64.AppImage

  publish-release:
    # Only create a GitHub Release for main/master pushes and version tags.
    # Feature-branch pushes still run build-windows/build-linux above
    # (producing downloadable artifacts) but skip this job, so they never
    # publish anything to the releases page.
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: [build-windows, build-linux]
    # Every build publishes its OWN release, so two pushes landing close
    # together no longer fight over one tag -- but they must not run the
    # retention sweep at the same time either. Serialised, never cancelled:
    # cancelling would silently drop a commit's pre-release.
    concurrency:
      group: publish-release
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        # Only for the version in api/pyproject.toml, which names the release.
        uses: actions/checkout@v4

      - name: Download Windows binary
        uses: actions/download-artifact@v4
        with:
          name: hackdeepwiki-windows
          path: ./artifacts/windows

      - name: Download Linux AppImage
        uses: actions/download-artifact@v4
        with:
          name: hackdeepwiki-linux
          path: ./artifacts/linux

      - name: Work out the release identity and arrange the assets
        run: |
          set -uo pipefail
          mv ./artifacts/windows/hackdeepwiki.exe ./HackDeepWiki-windows-x64.exe
          mv ./artifacts/linux/HackDeepWiki-x86_64.AppImage ./HackDeepWiki-x86_64.AppImage

          # The app's own version, so a pre-release says which release it is
          # leading up to instead of just "development build".
          VERSION=$(grep -m1 -E '^version *= *"' api/pyproject.toml | cut -d'"' -f2)
          VERSION=${VERSION:-0.0.0}
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)

          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            # A version tag is the stable release: its tag already exists and
            # is the whole point, so nothing is generated here.
            TAG_NAME="${{ github.ref_name }}"
            RELEASE_NAME="Release ${{ github.ref_name }}"
            IS_PRERELEASE=false
          else
            # ONE RELEASE PER BUILD. Every main push used to land on the same
            # rolling "pre-release" tag, so each build silently replaced the
            # previous one and there was no way to go back to (or link to) an
            # earlier development build. github.run_number is monotonic and
            # unique for the repository, which makes vX.Y.Z-pre.N a valid
            # semver pre-release that sorts in build order and BELOW the
            # stable vX.Y.Z it leads to. Re-running a build reuses its run
            # number, so a re-run updates its own release instead of adding
            # a duplicate.
            TAG_NAME="v${VERSION}-pre.${{ github.run_number }}"
            RELEASE_NAME="v${VERSION} pre-release #${{ github.run_number }} (${SHORT_SHA})"
            IS_PRERELEASE=true
          fi

          {
            echo "VERSION=$VERSION"
            echo "SHORT_SHA=$SHORT_SHA"
            echo "TAG_NAME=$TAG_NAME"
            echo "RELEASE_NAME=$RELEASE_NAME"
            echo "IS_PRERELEASE=$IS_PRERELEASE"
          } >> $GITHUB_ENV

      - name: Create the Github Release
        uses: softprops/action-gh-release@v2
        with:
          # The tag is created on this commit if it doesn't exist yet.
          tag_name: ${{ env.TAG_NAME }}
          target_commitish: ${{ github.sha }}
          name: ${{ env.RELEASE_NAME }}
          prerelease: ${{ env.IS_PRERELEASE == 'true' }}
          draft: false
          body: |
            ${{ env.IS_PRERELEASE == 'true' && format('Development build **#{0}** of HackDeepWiki v{1} — one release per build, so this one stays put and is not replaced by the next.', github.run_number, env.VERSION) || format('HackDeepWiki {0}.', github.ref_name) }}

            - Branch: `${{ github.ref_name }}`
            - Commit: [`${{ env.SHORT_SHA }}`](https://github.com/${{ github.repository }}/commit/${{ github.sha }})
            - Built at: ${{ github.event.head_commit.timestamp || 'N/A' }}
            - Build log: [run #${{ github.run_number }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})

            ### Standalone Executables
            - **Windows**: [HackDeepWiki-windows-x64.exe](https://github.com/${{ github.repository }}/releases/download/${{ env.TAG_NAME }}/HackDeepWiki-windows-x64.exe)
            - **Linux (AppImage)**: [HackDeepWiki-x86_64.AppImage](https://github.com/${{ github.repository }}/releases/download/${{ env.TAG_NAME }}/HackDeepWiki-x86_64.AppImage)

            *No installation is required. Simply download and run the binary for your platform.*
          files: |
            HackDeepWiki-windows-x64.exe
            HackDeepWiki-x86_64.AppImage
          make_latest: ${{ env.IS_PRERELEASE == 'false' }}

      - name: Prune superseded pre-releases
        # Keeping every build forever would bury the stable releases (and each
        # one carries ~600 MB of binaries), so the newest KEEP development
        # builds are kept and older ones are removed along with their tags.
        # Strictly scoped to the tags THIS workflow generates: stable vX.Y.Z
        # releases, the legacy rolling "pre-release", and anything published
        # by hand are never matched, and a failure here must not fail a
        # release that already succeeded.
        if: env.IS_PRERELEASE == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: 10
        run: |
          set -uo pipefail
          # Newest first, then skip the KEEP we are keeping: the arithmetic
          # stays in the shell so the jq program needs no interpolation.
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 \
            --json tagName,isPrerelease,createdAt \
            --jq '[.[] | select(.isPrerelease)
                       | select(.tagName | test("^v[0-9]+(\\.[0-9]+)*-pre\\.[0-9]+$"))]
                  | sort_by(.createdAt) | reverse | .[].tagName' \
          | tail -n "+$((KEEP + 1))" \
          | while read -r tag; do
              [ -n "$tag" ] || continue
              echo "Removing superseded pre-release $tag"
              gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
            done
