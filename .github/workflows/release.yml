name: Publish packaged release

on:
  workflow_call:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: publish-release
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Download Windows executable
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: hackdeepwiki-windows
          path: artifacts/windows

      - name: Download Linux AppImage
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: hackdeepwiki-linux
          path: artifacts/linux

      - name: Download build inventory
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: hackdeepwiki-metadata
          path: artifacts/metadata

      - name: Arrange assets and derive build identity
        shell: bash
        run: |
          set -euo pipefail
          mv artifacts/windows/hackdeepwiki.exe HackDeepWiki-windows-x64.exe
          mv artifacts/linux/HackDeepWiki-x86_64.AppImage HackDeepWiki-x86_64.AppImage
          cp artifacts/metadata/HackDeepWiki.cdx.json HackDeepWiki.cdx.json
          cp artifacts/metadata/components.json HackDeepWiki-components.json
          sha256sum \
            HackDeepWiki-windows-x64.exe \
            HackDeepWiki-x86_64.AppImage \
            HackDeepWiki.cdx.json \
            HackDeepWiki-components.json > SHA256SUMS

          short_sha="${GITHUB_SHA:0:7}"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag_name="$GITHUB_REF_NAME"
            release_name="Release $GITHUB_REF_NAME"
            prerelease=false
          else
            tag_name="build-${GITHUB_RUN_NUMBER}-${short_sha}"
            release_name="Development build #${GITHUB_RUN_NUMBER} (${short_sha})"
            prerelease=true
          fi
          {
            echo "SHORT_SHA=$short_sha"
            echo "TAG_NAME=$tag_name"
            echo "RELEASE_NAME=$release_name"
            echo "IS_PRERELEASE=$prerelease"
          } >> "$GITHUB_ENV"

      - name: Publish immutable build
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          target_commitish: ${{ github.sha }}
          name: ${{ env.RELEASE_NAME }}
          prerelease: ${{ env.IS_PRERELEASE == 'true' }}
          draft: false
          make_latest: ${{ env.IS_PRERELEASE == 'false' }}
          body: |
            ${{ env.IS_PRERELEASE == 'true' && format('Development build #{0} of HackDeepWiki. Automatic builds use a build ID, never a fictitious product version.', github.run_number) || format('HackDeepWiki release {0}.', github.ref_name) }}

            - Branch/tag: `${{ github.ref_name }}`
            - Commit: [`${{ env.SHORT_SHA }}`](https://github.com/${{ github.repository }}/commit/${{ github.sha }})
            - Build log: [run #${{ github.run_number }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
            - Checksums and CycloneDX inventory are attached.
          files: |
            HackDeepWiki-windows-x64.exe
            HackDeepWiki-x86_64.AppImage
            HackDeepWiki.cdx.json
            HackDeepWiki-components.json
            SHA256SUMS

      - name: Prune superseded automatic builds
        if: env.IS_PRERELEASE == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: 10
        shell: bash
        run: |
          set -euo pipefail
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 \
            --json tagName,isPrerelease,createdAt \
            --jq '[.[] | select(.isPrerelease)
                       | select(.tagName | test("^build-[0-9]+-[0-9a-f]{7}$"))]
                  | sort_by(.createdAt) | reverse | .[].tagName' \
          | tail -n "+$((KEEP + 1))" \
          | while read -r tag; do
              [ -n "$tag" ] || continue
              gh release delete "$tag" \
                --repo "$GITHUB_REPOSITORY" \
                --cleanup-tag \
                --yes || true
            done
